[package]
name = "wireguard-tray"
version = "2.0.0"
edition = "2021"
rust-version = "1.85"
description = "Switch between WireGuard networks (NetworkManager) from the system tray"
license = "MIT"
publish = false

[dependencies]
ksni = { version = "0.3.6", default-features = false, features = ["blocking", "async-io"] }
libc = "0.2"
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
